<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio layout review</title>
<style>*{box-sizing:border-box}body{margin:0;background:#dbded5;color:#242520;font:13px system-ui}header{display:flex;align-items:center;gap:13px;padding:12px 20px;background:#f7f5f0;flex-wrap:wrap}label{display:flex;gap:7px;align-items:center}select,button{font:12px system-ui;background:#f7f5f0;border:1px solid #b6bdae;color:#242520;padding:8px;min-height:34px}#stage{position:relative;margin:18px auto 28px}iframe{position:absolute;left:0;top:0;transform-origin:top left;border:0;box-shadow:0 8px 25px #30382823}#result{font-size:11px}h1{font-size:13px;margin:0;font-weight:600}</style></head>
<body><header><h1>Production review</h1><label>Viewport<select id="size"><option value="1440,900">1440 × 900</option><option value="390,844">390 × 844</option><option value="320,568">320 × 568</option><option value="430,932">430 × 932</option><option value="768,1024">768 × 1024</option><option value="1024,768">1024 × 768</option><option value="640,360">640 × 360</option><option value="1920,1080">1920 × 1080</option></select></label><label>Section<select id="section"><option value="home">Home</option><option value="work">Work</option><option value="training">GPU project</option><option value="about">About</option><option value="contact">Contact</option></select></label><button id="back">Up 120px</button><button id="forward">Down 120px</button><button id="audit">Check layout</button><button id="reload">Reload build</button><button id="context">Lose context</button><button id="restore">Restore context</button><span id="result" role="status"></span></header><div id="stage"><iframe id="preview" title="Production portfolio preview" src="./dist/index.html"></iframe></div>
<script type="module">
const frame=document.querySelector('#preview'),stage=document.querySelector('#stage'),select=document.querySelector('#size'),section=document.querySelector('#section'),result=document.querySelector('#result');let extension;
function resize(){const[w,h]=select.value.split(',').map(Number);const scale=Math.min(1,(innerWidth-44)/w,(innerHeight-140)/h);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform=`scale(${scale})`;stage.style.width=w*scale+'px';stage.style.height=h*scale+'px';result.textContent=`${w} × ${h} CSS px`;}
select.onchange=resize;addEventListener('resize',resize);resize();
section.onchange=()=>{frame.contentWindow.location.hash=section.value;};
document.querySelector('#back').onclick=()=>frame.contentWindow.scrollBy({top:-120,behavior:'instant'});
document.querySelector('#forward').onclick=()=>frame.contentWindow.scrollBy({top:120,behavior:'instant'});
document.querySelector('#reload').onclick=()=>frame.contentWindow.location.reload();
document.querySelector('#audit').onclick=()=>{const doc=frame.contentDocument,win=frame.contentWindow;const missing=[...doc.images].filter(i=>i.complete&&!i.naturalWidth).length;const overflow=doc.documentElement.scrollWidth>win.innerWidth;result.textContent=`${overflow?'OVERFLOW':'No overflow'} · ${missing} failed images · ${doc.querySelectorAll('h1').length} H1`;};
document.querySelector('#context').onclick=()=>{const canvas=frame.contentDocument.querySelector('canvas');if(!canvas){result.textContent='Layered fallback is active';return;}extension=canvas.getContext('webgl2')?.getExtension('WEBGL_lose_context');extension?.loseContext();result.textContent='Context lost; inspect fallback';};
document.querySelector('#restore').onclick=()=>{extension?.restoreContext();result.textContent='Context restored; inspect exhibit';};
</script></body></html>
