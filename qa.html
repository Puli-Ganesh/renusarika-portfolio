<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio — responsive QA studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#232a30;color:#e8ebe9;font:13px system-ui}header{display:flex;align-items:center;gap:16px;padding:14px 22px;background:#111820;flex-wrap:wrap}label{display:flex;align-items:center;gap:8px}select,button{font:12px system-ui;min-height:34px;border:1px solid #53636a;color:#fff;background:#1b272f;padding:6px 10px;border-radius:3px}a{color:#b4dfcf}#stage{position:relative;margin:22px auto 40px}iframe{position:absolute;left:0;top:0;transform-origin:top left;border:0;background:#090f17;box-shadow:0 5px 50px #0008}#result{margin-left:auto;font-size:11px;color:#b4dfcf}h1{font-size:13px;font-weight:500;margin:0 14px 0 0}
</style></head><body><header><h1>Responsive QA studio</h1><label>Viewport <select id="size"><option value="1440,900">1440 × 900 · Desktop</option><option value="320,568">320 × 568 · Narrow phone</option><option value="360,800">360 × 800 · Android</option><option value="390,844">390 × 844 · Phone</option><option value="430,932">430 × 932 · Large phone</option><option value="768,1024">768 × 1024 · Tablet</option><option value="1024,768">1024 × 768 · Compact</option><option value="1280,900">1280 × 900 · Laptop</option><option value="1920,1080">1920 × 1080 · Desktop</option><option value="2560,1080">2560 × 1080 · Ultrawide</option><option value="640,360">640 × 360 · Landscape phone</option></select></label><label>Chapter <select id="chapter"><option value="hero">Hero</option><option value="about">About</option><option value="skills">Skills</option><option value="projects">Scheduler</option><option value="pipeline">GPU pipeline</option><option value="experience">Experience</option><option value="education">Education</option><option value="contact">Contact</option></select></label><button id="audit">Check layout</button><button id="loss">Lose WebGL context</button><button id="restore">Restore context</button><span id="result" role="status"></span></header><div id="stage"><iframe id="site" title="Portfolio preview" src="/"></iframe></div><script type="module">
const frame=document.querySelector('#site'),stage=document.querySelector('#stage'),select=document.querySelector('#size'),chapter=document.querySelector('#chapter'),result=document.querySelector('#result');let contextExtension;
function resize(){const [w,h]=select.value.split(',').map(Number);const scale=Math.min(1,(innerWidth-48)/w,(innerHeight-120)/h);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform=`scale(${scale})`;stage.style.width=w*scale+'px';stage.style.height=h*scale+'px';result.textContent=`${w} × ${h} CSS px`;}
select.addEventListener('change',resize);addEventListener('resize',resize);resize();
chapter.addEventListener('change',()=>{const doc=frame.contentDocument;const id=chapter.value;const target=doc.getElementById(id);if(target){frame.contentWindow.location.hash=id;target.scrollIntoView();}});
document.querySelector('#audit').onclick=()=>{const doc=frame.contentDocument;const win=frame.contentWindow;const overflow=doc.documentElement.scrollWidth>win.innerWidth;const images=[...doc.querySelectorAll('img')];const missing=images.filter(im=>im.complete&&!im.naturalWidth).length;result.textContent=`${overflow?'OVERFLOW':'No horizontal overflow'} · ${missing} failed images · ${doc.querySelectorAll('main > section').length} chapters`;};
document.querySelector('#loss').onclick=()=>{const canvas=frame.contentDocument.querySelector('canvas');if(!canvas){result.textContent='Static fallback is active';return;}contextExtension=canvas.getContext('webgl2')?.getExtension('WEBGL_lose_context');contextExtension?.loseContext();result.textContent='Context lost: inspect fallback';};
document.querySelector('#restore').onclick=()=>{contextExtension?.restoreContext();result.textContent='Context restored: inspect scene';};
</script></body></html>
